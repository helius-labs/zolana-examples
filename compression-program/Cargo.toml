[workspace]
resolver = "2"
members = ["program", "sdk", "test"]

[workspace.package]
edition = "2021"

# Match the Zolana revision used by the local test stack.
[workspace.dependencies]
anyhow = "1.0"
borsh = { version = "1.5", default-features = false, features = ["derive"] }
light-program-profiler = { git = "https://github.com/Lightprotocol/light-program-profiler", rev = "db49f3c801996a80e1cb7e4e92b13a694e962b65" }
num-bigint = "0.4.6"
pinocchio = "0.11"
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-program-error = "3.0"
solana-signature = "3.4"
solana-signer = "3.0"
thiserror = "2.0"
wincode = { version = "0.5", features = ["derive"] }
zolana-account-checks = { git = "https://github.com/helius-labs/zolana", rev = "ebca3ad1bd2f27b1f1f04e33fbfa3cc4c7bbf856", version = "0.8.0", default-features = false }
zolana-client = { git = "https://github.com/helius-labs/zolana", rev = "ebca3ad1bd2f27b1f1f04e33fbfa3cc4c7bbf856", version = "0.1.0" }
zolana-hasher = { git = "https://github.com/helius-labs/zolana", rev = "ebca3ad1bd2f27b1f1f04e33fbfa3cc4c7bbf856", version = "5.0.0", default-features = false }
zolana-interface = { git = "https://github.com/helius-labs/zolana", rev = "ebca3ad1bd2f27b1f1f04e33fbfa3cc4c7bbf856", version = "0.1.0" }
zolana-keypair = { git = "https://github.com/helius-labs/zolana", rev = "ebca3ad1bd2f27b1f1f04e33fbfa3cc4c7bbf856", version = "0.1.0" }
zolana-program = { git = "https://github.com/helius-labs/zolana", rev = "ebca3ad1bd2f27b1f1f04e33fbfa3cc4c7bbf856", version = "0.1.0" }
zolana-test-utils = { git = "https://github.com/helius-labs/zolana", rev = "ebca3ad1bd2f27b1f1f04e33fbfa3cc4c7bbf856", version = "0.1.0" }
zolana-transaction = { git = "https://github.com/helius-labs/zolana", rev = "ebca3ad1bd2f27b1f1f04e33fbfa3cc4c7bbf856", version = "0.1.0" }
zolana-tree = { git = "https://github.com/helius-labs/zolana", rev = "ebca3ad1bd2f27b1f1f04e33fbfa3cc4c7bbf856", version = "0.1.0" }

[profile.release]
overflow-checks = true
