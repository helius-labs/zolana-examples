[package]
name = "dvp-sdk"
version = "0.1.0"
edition.workspace = true
publish = false
autotests = false

[dependencies]
xark = { workspace = true }
xark-groth16 = { workspace = true }
# xark-groth16 leaves its MSM and FFT crates sequential (only its dev
# dependencies enable `parallel`); unify the features so native proofs use Rayon.
ark-ec = { version = "0.6", default-features = false, features = ["std", "parallel"] }
ark-poly = { version = "0.6", default-features = false, features = ["std", "parallel"] }
sha2 = "0.10"
tempfile = "3"
anyhow = { workspace = true }
dvp-program = { path = "../program", features = ["circuits", "parallel"] }
num-bigint = { workspace = true }
solana-address = { workspace = true, features = ["curve25519"] }
solana-instruction = { workspace = true }
solana-signature = { workspace = true }
wincode = { workspace = true }
zolana-client = { workspace = true, features = ["reqwest"] }
zolana-hasher = { workspace = true }
zolana-interface = { workspace = true }
zolana-keypair = { workspace = true }
zolana-program = { workspace = true, features = ["compression", "client", "parallel"] }
zolana-transaction = { workspace = true }


[dev-dependencies]
zolana-program = { workspace = true, features = ["test-support"] }
groth16-solana = { workspace = true }
solana-keypair = { workspace = true }

[[test]]
name = "circuits"
path = "tests/circuits.rs"
