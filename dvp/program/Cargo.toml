[package]
name = "dvp-program"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "dvp_program"
crate-type = ["cdylib", "lib"]

[features]
# Deterministic test keys are guarded by the insecure-test-setup feature.
default = ["insecure-test-setup"]
insecure-test-setup = []
bpf-entrypoint = []
no-entrypoint = []
cpi = ["no-entrypoint"]
test-sbf = []
circuits = [
    "dep:zolana-keypair",
    "dep:zolana-transaction",
    "zolana-program/client",
    "zolana-program/setup",
    "zolana-program/serde",
]
parallel = ["zolana-program/parallel"]
r1cs-export = ["circuits", "zolana-program/r1cs-export"]
wasm = ["circuits", "zolana-program/wasm"]

profile-program = ["light-program-profiler/profile-program"]

[dependencies]
groth16-solana = { workspace = true, features = ["bsb22"] }
light-program-profiler = { workspace = true }
pinocchio = { workspace = true, features = ["cpi"] }
# `curve25519` gives `Address::create_program_address` a host implementation;
# on SBF it uses the syscall and pulls in no curve dependency.
solana-address = { workspace = true, features = ["curve25519"] }
solana-program-error = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }
zolana-account-checks = { workspace = true }
zolana-hasher = { workspace = true }
zolana-interface = { workspace = true }
zolana-program = { workspace = true, features = ["cpi", "compression", "verifier"] }
zolana-keypair = { workspace = true, optional = true }
zolana-transaction = { workspace = true, optional = true }

[dev-dependencies]
mollusk-svm = { workspace = true }
zolana-test-utils = { workspace = true, features = ["mollusk"] }
solana-account = { workspace = true }
solana-instruction = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
