[package]
name = "dvp-program"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "dvp_program"
crate-type = ["cdylib", "lib"]

[features]
# Deterministic test keys are guarded by the insecure-test-setup feature.
default = ["insecure-test-setup"]
insecure-test-setup = []
bpf-entrypoint = []
circuits = ["dep:xark", "spr-program/client"]
r1cs-export = ["circuits", "spr-program/r1cs-export"]
wasm = ["circuits", "spr-program/wasm"]

profile-program = ["light-program-profiler/profile-program"]

[dependencies]
xark = { workspace = true, optional = true }
groth16-solana = { workspace = true, features = ["bsb22"] }
light-program-profiler = { workspace = true }
pinocchio = { workspace = true, features = ["cpi"] }
# `curve25519` gives `Address::create_program_address` a host implementation;
# on SBF it uses the syscall and pulls in no curve dependency.
solana-address = { workspace = true, features = ["curve25519"] }
solana-program-error = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }
spr-account-checks = { workspace = true }
spr-hasher = { workspace = true }
spr-interface = { workspace = true }
spr-program = { workspace = true, features = ["cpi", "compression", "verifier"] }

[dev-dependencies]
mollusk-svm = { workspace = true }
spr-test-utils = { workspace = true, features = ["mollusk"] }
solana-account = { workspace = true }
solana-instruction = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(xark)',
    'cfg(xark_client)',
    'cfg(target_os, values("solana"))',
    # light-program-profiler's `#[profile]` checks this feature.
    'cfg(feature, values("profile-heap"))',
]
