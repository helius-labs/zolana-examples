[workspace]
resolver = "2"
members = ["program", "sdk", "test"]

[workspace.package]
edition = "2021"

# Zolana crates use one pinned revision; Solana dependencies match its SDK.
[workspace.dependencies]
zolana-account-checks = { git = "https://github.com/helius-labs/zolana", rev = "f280c4ad2788f5aa8cafcd7fd394ede5d9ee893e", default-features = false }
zolana-client = { git = "https://github.com/helius-labs/zolana", rev = "f280c4ad2788f5aa8cafcd7fd394ede5d9ee893e" }
zolana-hasher = { git = "https://github.com/helius-labs/zolana", rev = "f280c4ad2788f5aa8cafcd7fd394ede5d9ee893e", default-features = false }
zolana-interface = { git = "https://github.com/helius-labs/zolana", rev = "f280c4ad2788f5aa8cafcd7fd394ede5d9ee893e" }
zolana-keypair = { git = "https://github.com/helius-labs/zolana", rev = "f280c4ad2788f5aa8cafcd7fd394ede5d9ee893e" }
zolana-merkle-tree = { git = "https://github.com/helius-labs/zolana", rev = "f280c4ad2788f5aa8cafcd7fd394ede5d9ee893e" }
zolana-program = { git = "https://github.com/helius-labs/zolana", rev = "f280c4ad2788f5aa8cafcd7fd394ede5d9ee893e" }
zolana-program-test = { git = "https://github.com/helius-labs/zolana", rev = "f280c4ad2788f5aa8cafcd7fd394ede5d9ee893e" }
zolana-test-utils = { git = "https://github.com/helius-labs/zolana", rev = "f280c4ad2788f5aa8cafcd7fd394ede5d9ee893e" }
zolana-transaction = { git = "https://github.com/helius-labs/zolana", rev = "f280c4ad2788f5aa8cafcd7fd394ede5d9ee893e" }
zolana-tree = { git = "https://github.com/helius-labs/zolana", rev = "f280c4ad2788f5aa8cafcd7fd394ede5d9ee893e" }

groth16-solana = { git = "https://github.com/Lightprotocol/groth16-solana", rev = "70a93803e5f55b8425301d506c625169ef557c9d", features = ["bsb22"] }
light-program-profiler = { git = "https://github.com/Lightprotocol/light-program-profiler", rev = "db49f3c801996a80e1cb7e4e92b13a694e962b65" }

anyhow = "1.0"
mollusk-svm = "0.15.0"
num-bigint = "0.4.6"
pinocchio = "0.11"
thiserror = "2.0"
wincode = { version = "0.5", features = ["derive"] }
solana-account = "4.3"
solana-clock = { version = "3.1", features = ["sysvar", "wincode"] }
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-program-error = "3.0"
solana-signature = "3.4"
solana-signer = "3.0"

[profile.release]
overflow-checks = true

# Match the release workspace: zk-tools and the SDK use one hasher crate.
[patch."https://github.com/helius-labs/zolana"]
zolana-hasher = { path = "../../zolana-core/program-libs/hasher" }
