[workspace]
resolver = "2"
members = ["program", "sdk", "test"]

[workspace.package]
edition = "2021"

# Zolana crates use one pinned revision; Solana dependencies match its SDK.
[workspace.dependencies]
zolana-account-checks = { package = "spr-account-checks", git = "https://github.com/helius-labs/zolana", rev = "4138fe7cf46f34d29ac740c7be7891174e639fee", default-features = false }
zolana-client = { package = "spr-client", git = "https://github.com/helius-labs/zolana", rev = "4138fe7cf46f34d29ac740c7be7891174e639fee" }
zolana-hasher = { package = "spr-hasher", git = "https://github.com/helius-labs/zolana", rev = "4138fe7cf46f34d29ac740c7be7891174e639fee", default-features = false }
zolana-interface = { package = "spr-interface", git = "https://github.com/helius-labs/zolana", rev = "4138fe7cf46f34d29ac740c7be7891174e639fee" }
zolana-keypair = { package = "spr-keypair", git = "https://github.com/helius-labs/zolana", rev = "4138fe7cf46f34d29ac740c7be7891174e639fee" }
zolana-merkle-tree = { package = "spr-merkle-tree", git = "https://github.com/helius-labs/zolana", rev = "4138fe7cf46f34d29ac740c7be7891174e639fee" }
spr-program = { git = "https://github.com/helius-labs/zolana", rev = "4138fe7cf46f34d29ac740c7be7891174e639fee" }
spr-program-test = { package = "spr-program-test", git = "https://github.com/helius-labs/zolana", rev = "4138fe7cf46f34d29ac740c7be7891174e639fee" }
zolana-test-utils = { package = "spr-test-utils", git = "https://github.com/helius-labs/zolana", rev = "4138fe7cf46f34d29ac740c7be7891174e639fee" }
zolana-transaction = { package = "spr-transaction", git = "https://github.com/helius-labs/zolana", rev = "4138fe7cf46f34d29ac740c7be7891174e639fee" }
zolana-tree = { package = "spr-tree", git = "https://github.com/helius-labs/zolana", rev = "4138fe7cf46f34d29ac740c7be7891174e639fee" }

groth16-solana = { version = "0.3.1", features = ["bsb22"] }
light-program-profiler = { git = "https://github.com/Lightprotocol/light-program-profiler", rev = "db49f3c801996a80e1cb7e4e92b13a694e962b65" }

anyhow = "1.0"
mollusk-svm = "0.15.0"
num-bigint = "0.4.6"
pinocchio = "0.11"
thiserror = "2.0"
wincode = { version = "0.5", features = ["derive"] }
solana-account = "4.3"
solana-clock = { version = "3.1", features = ["sysvar", "wincode"] }
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-program-error = "3.0"
solana-signature = "3.4"
solana-signer = "3.0"

[profile.release]
overflow-checks = true

# Match the release workspace: zk-tools and the SDK use one hasher crate.
[patch."https://github.com/helius-labs/zolana"]
spr-hasher = { path = "../../zolana-core/program-libs/hasher" }
