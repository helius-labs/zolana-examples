[workspace]
resolver = "2"
members = ["program", "sdk", "test"]

[workspace.package]
edition = "2021"

# Zolana crates use one pinned revision; Solana dependencies match its SDK.
[workspace.dependencies]
zolana-account-checks = { git = "https://github.com/helius-labs/zolana", rev = "7770e164e", default-features = false }
zolana-client = { git = "https://github.com/helius-labs/zolana", rev = "7770e164e" }
zolana-hasher = { git = "https://github.com/helius-labs/zolana", rev = "7770e164e", default-features = false }
zolana-interface = { git = "https://github.com/helius-labs/zolana", rev = "7770e164e" }
zolana-keypair = { git = "https://github.com/helius-labs/zolana", rev = "7770e164e" }
zolana-merkle-tree = { git = "https://github.com/helius-labs/zolana", rev = "7770e164e" }
zolana-program = { git = "https://github.com/helius-labs/zolana", rev = "7770e164e" }
zolana-program-test = { git = "https://github.com/helius-labs/zolana", rev = "7770e164e" }
zolana-test-utils = { git = "https://github.com/helius-labs/zolana", rev = "7770e164e" }
zolana-transaction = { git = "https://github.com/helius-labs/zolana", rev = "7770e164e" }
zolana-tree = { git = "https://github.com/helius-labs/zolana", rev = "7770e164e" }

groth16-solana = { git = "https://github.com/Lightprotocol/groth16-solana", rev = "70a93803e5f55b8425301d506c625169ef557c9d", features = ["bsb22"] }
light-program-profiler = { git = "https://github.com/Lightprotocol/light-program-profiler", rev = "db49f3c801996a80e1cb7e4e92b13a694e962b65" }

anyhow = "1.0"
mollusk-svm = "0.15.0"
num-bigint = "0.4.6"
pinocchio = "0.11"
thiserror = "2.0"
wincode = { version = "0.5", features = ["derive"] }
solana-account = "4.3"
solana-clock = { version = "3.1", features = ["sysvar", "wincode"] }
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-program-error = "3.0"
solana-signature = "3.4"
solana-signer = "3.0"

[profile.release]
overflow-checks = true

# Devnet still runs the Zolana v0.4.0 pool (nullifier root history 100).
# zolana-dvp-compat is 7770e164e with #428 reverted so the client accepts it.
[patch."https://github.com/helius-labs/zolana"]
zolana-account-checks = { path = "../../zolana-dvp-compat/program-libs/account-checks" }
zolana-api = { path = "../../zolana-dvp-compat/sdk-libs/zolana-api" }
zolana-client = { path = "../../zolana-dvp-compat/sdk-libs/client" }
zolana-event = { path = "../../zolana-dvp-compat/program-libs/event" }
zolana-event-parser = { path = "../../zolana-dvp-compat/sdk-libs/event" }
zolana-hasher = { path = "../../zolana-dvp-compat/program-libs/hasher" }
zolana-indexed-array = { path = "../../zolana-dvp-compat/program-libs/indexed-array" }
zolana-indexer-api = { path = "../../zolana-dvp-compat/sdk-libs/indexer-api" }
zolana-instruction = { path = "../../zolana-dvp-compat/sdk-libs/instruction" }
zolana-interface = { path = "../../zolana-dvp-compat/program-libs/interface" }
zolana-keypair = { path = "../../zolana-dvp-compat/sdk-libs/keypair" }
zolana-macros = { path = "../../zolana-dvp-compat/sdk-libs/macros" }
zolana-merkle-tree = { path = "../../zolana-dvp-compat/sdk-libs/merkle-tree" }
zolana-program = { path = "../../zolana-dvp-compat/sdk-libs/program" }
zolana-program-test = { path = "../../zolana-dvp-compat/sdk-libs/program-test" }
zolana-smart-account-client = { path = "../../zolana-dvp-compat/sdk-libs/smart-account-client" }
zolana-test-utils = { path = "../../zolana-dvp-compat/program-tests/test-utils" }
zolana-transaction = { path = "../../zolana-dvp-compat/sdk-libs/transaction" }
zolana-tree = { path = "../../zolana-dvp-compat/program-libs/tree" }
zolana-user-registry-interface = { path = "../../zolana-dvp-compat/program-libs/user-registry-interface" }
zolana-zk-dsl = { path = "../../zolana-dvp-compat/zk/dsl" }
zolana-zk-gadgets = { path = "../../zolana-dvp-compat/zk/gadgets" }
zolana-zk-macros = { path = "../../zolana-dvp-compat/zk/macros" }
zolana-zk-macros-core = { path = "../../zolana-dvp-compat/zk/macros-core" }
