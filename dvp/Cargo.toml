[workspace]
resolver = "2"
members = ["program", "sdk", "test"]
exclude = [".tools/zolana", ".tools/xark"]

[workspace.package]
edition = "2021"

# Prepared by scripts/setup-zk-tools.sh at Zolana 226ddcb7ea4bdd1e328bf523a573f7c8d63d40eb.
# Its Xark path dependencies are resolved against the pinned sibling checkout.
[workspace.dependencies]
xark = { path = ".tools/xark/crates/lang" }
xark-groth16 = { path = ".tools/xark/crates/groth16" }
serde = { version = "1", features = ["derive"] }
tsify = { version = "0.5.6", features = ["js"] }
wasm-bindgen = "0.2"
zolana-account-checks = { path = ".tools/zolana/program-libs/account-checks", default-features = false }
zolana-client = { path = ".tools/zolana/sdk-libs/client" }
zolana-hasher = { path = ".tools/zolana/program-libs/hasher", default-features = false }
zolana-interface = { path = ".tools/zolana/program-libs/interface" }
zolana-keypair = { path = ".tools/zolana/sdk-libs/keypair" }
zolana-merkle-tree = { path = ".tools/zolana/sdk-libs/merkle-tree" }
zolana-program = { path = ".tools/zolana/sdk-libs/program" }
zolana-program-test = { path = ".tools/zolana/sdk-libs/program-test" }
zolana-test-utils = { path = ".tools/zolana/program-tests/test-utils" }
zolana-transaction = { path = ".tools/zolana/sdk-libs/transaction" }
zolana-tree = { path = ".tools/zolana/program-libs/tree" }

groth16-solana = { git = "https://github.com/Lightprotocol/groth16-solana", rev = "70a93803e5f55b8425301d506c625169ef557c9d", features = ["bsb22"] }
light-program-profiler = { git = "https://github.com/Lightprotocol/light-program-profiler", rev = "db49f3c801996a80e1cb7e4e92b13a694e962b65" }

anyhow = "1.0"
mollusk-svm = "0.15.0"
num-bigint = "0.4.6"
pinocchio = "0.11"
thiserror = "2.0"
wincode = { version = "0.5", features = ["derive"] }
solana-account = "4.3"
solana-clock = { version = "3.1", features = ["sysvar", "wincode"] }
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-program-error = "3.0"
solana-signature = "3.4"
solana-signer = "3.0"

[profile.release]
overflow-checks = true
