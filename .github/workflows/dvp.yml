name: dvp

on:
  push:
    branches: [main]
    paths:
      - "dvp/**"
      - ".github/workflows/dvp.yml"
  pull_request:
    paths:
      - "dvp/**"
      - ".github/workflows/dvp.yml"
  workflow_dispatch:

concurrency:
  group: dvp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGAVE_VERSION: v4.0.2
  SURFPOOL_RELEASE_TAG: v1.6.0-light
  SBF_TOOLS_VERSION: v1.54

jobs:
  dvp-test:
    name: test / dvp
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: dvp
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Prepare pinned SDK source
        run: scripts/setup-zk-tools.sh --prepare-only

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            dvp
            dvp/.tools/zolana

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dvp/typescript/package-lock.json

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Anza CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install pinned SBF platform tools
        working-directory: dvp/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" --install-only

      - name: Build pinned Zolana and Xark CLIs
        run: |
          scripts/setup-zk-tools.sh
          echo "ZOLANA_CLI_BIN=$PWD/.tools/zolana/target/release/zolana" >> "$GITHUB_ENV"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: dvp/.tools/zolana/prover/server/go.mod
          cache: false

      - name: Build localnet services from the pinned SDK
        run: scripts/build-localnet.sh >> "$GITHUB_ENV"

      - name: Download surfpool
        run: |
          bin="$RUNNER_TEMP/surfpool-bin"
          mkdir -p "$bin"
          curl -sSfL --retry 5 "https://github.com/Lightprotocol/surfpool/releases/download/${SURFPOOL_RELEASE_TAG}/surfpool-linux-x64.tar.gz" | tar -xz -C "$bin"
          test -x "$bin/surfpool"
          echo "SURFPOOL_BIN=$bin/surfpool" >> "$GITHUB_ENV"

      - name: Cache SPP proving keys
        uses: actions/cache@v4
        with:
          path: ~/.config/zolana/proving-keys
          key: zolana-proving-keys-${{ hashFiles('dvp/.tools/zolana/prover/server/prover/provingkeys/proving-keys.lock') }}

      - name: Cache DvP proving keys
        uses: actions/cache@v4
        with:
          path: dvp/target/zk/dvp-program
          key: dvp-xark-keys-${{ hashFiles('dvp/scripts/**', 'dvp/program/src/circuits/**', 'dvp/program/Cargo.toml', 'dvp/Cargo.lock', 'dvp/program/src/verifier/**', 'dvp/dvp-keys.CHECKSUM') }}

      - name: Check Rust formatting
        run: cargo fmt -p dvp-program -p dvp-sdk -p dvp-test -- --check

      # --check needs cached keys. The deterministic test setup regenerates
      # them and rewrites the verifiers, which must match the committed ones.
      - name: Check generated verifiers and circuit keys
        run: |
          "$ZOLANA_CLI_BIN" zk compile --test --manifest-path program/Cargo.toml
          git diff --exit-code -- program/src/verifier
          scripts/check-keys.sh

      - name: Build Node.js circuits
        run: '"$ZOLANA_CLI_BIN" zk compile --manifest-path program/Cargo.toml --skip-r1cs --skip-keys --wasm-target nodejs --verifier'

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build pinned TypeScript SDK
        run: |
          npm --prefix .tools/zolana ci
          npm --prefix .tools/zolana run build:ts

      - name: Check and test TypeScript
        working-directory: dvp/typescript
        run: |
          npm ci
          npm run check
          npm test

      - name: Build DvP program
        working-directory: dvp/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" -- --locked --features bpf-entrypoint

      - name: Run program tests
        run: cargo test --locked -p dvp-program --features bpf-entrypoint

      - name: Run Rust SDK tests
        run: cargo test --release --locked -p dvp-sdk

      - name: Run Rust end-to-end tests
        run: |
          mkdir -p ~/.config/zolana/proving-keys
          cargo test --release --locked -p dvp-test

      - name: Run Node.js end-to-end examples
        run: cargo test --release --locked -p dvp-test --test create_dvp node_client_lifecycles -- --ignored --nocapture
