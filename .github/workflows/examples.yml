name: examples

on:
  push:
    branches: [main]
    paths:
      - "rust-client/**"
      - "typescript-client/**"
      - "swap-program/**"
      - "escrow-program/**"
      - "k-lend-rfq/**"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "rust-client/**"
      - "typescript-client/**"
      - "swap-program/**"
      - "escrow-program/**"
      - "k-lend-rfq/**"
      - ".github/workflows/examples.yml"
  workflow_dispatch:

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

env:
  AGAVE_VERSION: v4.0.2
  SBF_TOOLS_VERSION: v1.54
  # bump to redump the Kamino programs from mainnet
  KAMINO_PROGRAMS_CACHE_VERSION: 1

jobs:
  rust-client:
    name: check / rust-client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-client
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-client

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check examples
        run: cargo check --all-targets --locked

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  typescript-client:
    name: check / typescript-client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript-client
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: typescript-client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check examples
        run: pnpm check

  swap-build:
    name: build / swap-program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: swap-program

      - name: Install Anza (Solana) CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install pinned SBF platform tools
        working-directory: swap-program/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" --install-only

      - name: Build swap program (SBF)
        working-directory: swap-program/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" -- --features bpf-entrypoint

  escrow-build:
    name: build / escrow-program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: escrow-program

      - name: Install Anza (Solana) CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install pinned SBF platform tools
        working-directory: escrow-program/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" --install-only

      - name: Build escrow program (SBF)
        working-directory: escrow-program/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" -- --features bpf-entrypoint

  k-lend-rfq:
    name: run / k-lend-rfq
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: k-lend-rfq
    env:
      ZOLANA_TAG: v0.4.0-alpha
      SURFPOOL_RELEASE_TAG: v1.6.0-light
      # Mainnet RPC for the mainnet_vault test; empty without the secret,
      # which skips it.
      KAMINO_MAINNET_RPC_URL: ${{ secrets.KAMINO_MAINNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: k-lend-rfq

      - name: Install Anza (Solana) CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # The zolana CLI, prover, Photon and shielded pool program attached to
      # the release the crates are pinned to; surfpool from the fork the zolana
      # CLI runs.
      - name: Download zolana release binaries
        run: |
          bin="$RUNNER_TEMP/zolana-bin"
          mkdir -p "$bin"
          base="https://github.com/helius-labs/zolana/releases/download/${ZOLANA_TAG}"
          for name in zolana prover photon; do
            curl -sSfL "${base}/${name}-linux-x64-${ZOLANA_TAG}" -o "$bin/$name"
            chmod +x "$bin/$name"
          done
          curl -sSfL "${base}/shielded_pool_program-${ZOLANA_TAG}.so" -o "$bin/shielded_pool_program.so"
          curl -sSfL "https://github.com/Lightprotocol/surfpool/releases/download/${SURFPOOL_RELEASE_TAG}/surfpool-linux-x64.tar.gz" \
            | tar -xz -C "$bin"
          test -x "$bin/surfpool"
          {
            echo "ZOLANA_CLI_BIN=$bin/zolana"
            echo "PROVER_BIN=$bin/prover"
            echo "ZOLANA_PHOTON_BIN=$bin/photon"
            echo "SURFPOOL_BIN=$bin/surfpool"
            echo "SHIELDED_POOL_PROGRAM_PATH=$bin/shielded_pool_program.so"
          } >> "$GITHUB_ENV"

      - name: Cache Kamino programs
        uses: actions/cache@v4
        with:
          path: k-lend-rfq/target/deploy/kamino_*.so
          key: kamino-programs-${{ env.KAMINO_PROGRAMS_CACHE_VERSION }}

      - name: Dump Kamino programs from mainnet
        run: scripts/dump-kamino.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Unit tests of the SDK, the market maker and the test utilities; they
      # need no localnet.
      - name: Run unit tests
        run: cargo test --locked --workspace --lib

      # The prover downloads the proving keys it is missing on first start.
      - name: Cache proving keys
        uses: actions/cache@v4
        with:
          path: ~/.config/zolana/proving-keys
          key: zolana-proving-keys-${{ env.ZOLANA_TAG }}

      - name: Run deposit_and_withdraw example
        run: cargo run --locked -p k-lend-rfq-example --example deposit_and_withdraw

      # mainnet_vault skips here and runs in its own step below.
      - name: Run market maker tests
        env:
          KAMINO_MAINNET_RPC_URL: ""
        run: cargo test --locked -p k-lend-market-maker --tests

      - name: Run mainnet vault test
        if: env.KAMINO_MAINNET_RPC_URL != ''
        run: cargo test --locked -p k-lend-market-maker --test mainnet_vault
