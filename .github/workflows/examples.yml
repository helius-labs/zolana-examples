name: examples

on:
  push:
    branches: [main]
    paths:
      - "rust-client/**"
      - "typescript-client/**"
      - "swap-program/**"
      - "escrow-program/**"
      - "dvp/**"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "rust-client/**"
      - "typescript-client/**"
      - "swap-program/**"
      - "escrow-program/**"
      - "dvp/**"
      - ".github/workflows/examples.yml"
  workflow_dispatch:

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

env:
  AGAVE_VERSION: v4.0.2
  SBF_TOOLS_VERSION: v1.54

jobs:
  rust-client:
    name: check / rust-client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-client
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-client

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check examples
        run: cargo check --all-targets --locked

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  typescript-client:
    name: check / typescript-client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript-client
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: typescript-client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check examples
        run: pnpm check

  swap-build:
    name: build / swap-program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: swap-program

      - name: Install Anza (Solana) CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install pinned SBF platform tools
        working-directory: swap-program/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" --install-only

      - name: Build swap program (SBF)
        working-directory: swap-program/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" -- --features bpf-entrypoint

  escrow-build:
    name: build / escrow-program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: escrow-program

      - name: Install Anza (Solana) CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install pinned SBF platform tools
        working-directory: escrow-program/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" --install-only

      - name: Build escrow program (SBF)
        working-directory: escrow-program/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" -- --features bpf-entrypoint

  dvp-test:
    name: test / dvp
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dvp
    env:
      ZOLANA_TAG: v0.4.0-alpha
      SURFPOOL_RELEASE_TAG: v1.6.0-light
      # A program built with platform tools v1.54 fails on chain: after the
      # first wincode serialize, every later serialize of the SPP transact
      # data errors with PreallocationSizeLimit, so each instruction returns
      # InvalidInstructionData before its CPI. v1.53, the default of the Agave
      # release above, and v1.52 work.
      SBF_TOOLS_VERSION: v1.53
    steps:
      - uses: actions/checkout@v4

      # The circuits' go.mod replaces zolana/prover and zolana/gnarksdk with a
      # zolana directory next to the checkout; unpack the release source
      # archive there.
      - name: Download zolana source
        run: |
          src="$GITHUB_WORKSPACE/../zolana"
          mkdir -p "$src"
          curl -sSfL "https://github.com/helius-labs/zolana/archive/refs/tags/${ZOLANA_TAG}.tar.gz" \
            | tar -xz -C "$src" --strip-components=1
          echo "ZOLANA_DIR=$(cd "$src" && pwd)" >> "$GITHUB_ENV"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: dvp/prover/circuits/go.sum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dvp

      - name: Install Anza (Solana) CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install pinned SBF platform tools
        working-directory: dvp/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" --install-only

      # The zolana CLI, prover, Photon and shielded pool program attached to
      # the release the crates are pinned to; surfpool from the fork the zolana
      # CLI runs.
      - name: Download zolana release binaries
        run: |
          bin="$RUNNER_TEMP/zolana-bin"
          mkdir -p "$bin"
          base="https://github.com/helius-labs/zolana/releases/download/${ZOLANA_TAG}"
          for name in zolana prover photon; do
            curl -sSfL "${base}/${name}-linux-x64-${ZOLANA_TAG}" -o "$bin/$name"
            chmod +x "$bin/$name"
          done
          curl -sSfL "${base}/shielded_pool_program-${ZOLANA_TAG}.so" -o "$bin/shielded_pool_program.so"
          curl -sSfL "https://github.com/Lightprotocol/surfpool/releases/download/${SURFPOOL_RELEASE_TAG}/surfpool-linux-x64.tar.gz" \
            | tar -xz -C "$bin"
          test -x "$bin/surfpool"
          {
            echo "ZOLANA_CLI_BIN=$bin/zolana"
            echo "PROVER_BIN=$bin/prover"
            echo "ZOLANA_PHOTON_BIN=$bin/photon"
            echo "SURFPOOL_BIN=$bin/surfpool"
            echo "SHIELDED_POOL_PROGRAM_PATH=$bin/shielded_pool_program.so"
          } >> "$GITHUB_ENV"

      # The prover downloads the SPP proving keys it is missing on first start.
      - name: Cache SPP proving keys
        uses: actions/cache@v4
        with:
          path: ~/.config/zolana/proving-keys
          key: zolana-proving-keys-${{ env.ZOLANA_TAG }}

      - name: Cache DvP circuit keys
        uses: actions/cache@v4
        with:
          path: dvp/build/gnark
          key: dvp-gnark-keys-${{ hashFiles('dvp/prover/circuits/**/*.go', 'dvp/prover/circuits/go.sum', 'dvp/dvp-keys.CHECKSUM') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Vet circuits
        run: scripts/circuits-go.sh vet ./...

      - name: Test circuits
        run: scripts/circuits-go.sh test -timeout 30m ./...

      # Regenerating the insecure test keys must reproduce the committed
      # verifying keys and the key hashes in dvp-keys.CHECKSUM.
      - name: Generate missing circuit keys
        run: |
          for c in create_dvp reclaim_dvp settle_dvp abort_dvp; do
            if [[ ! -f "build/gnark/$c/pk.bin" ]]; then
              cargo run --locked -p dvp-prover --bin dvp-prover-setup -- \
                "$c" "build/gnark/$c" --rust-vk "program/src/verifying_keys/$c.rs" --insecure-test-keys
            fi
          done
          git diff --exit-code program/src/verifying_keys

      - name: Check circuit key checksums
        run: scripts/check-keys.sh

      # Without bpf-entrypoint the .so in target/deploy has no entrypoint and
      # the e2e tests cannot load the program.
      - name: Build DvP program (SBF)
        working-directory: dvp/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" -- --features bpf-entrypoint

      - name: Run program tests
        run: cargo test-sbf --tools-version "$SBF_TOOLS_VERSION" -p dvp-program --features bpf-entrypoint

      - name: Run prover and SDK tests
        run: cargo test --locked -p dvp-prover -p dvp-sdk

      # Localnet e2e; the CU benchmark is #[ignore] and does not run. The
      # prover downloads missing SPP keys into the keys dir, but requires its
      # parent to exist, which a fresh runner without a cache hit lacks.
      - name: Run e2e tests
        run: |
          mkdir -p ~/.config/zolana/proving-keys
          cargo test --locked -p dvp-test
