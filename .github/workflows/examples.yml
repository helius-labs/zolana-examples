name: examples

on:
  push:
    branches: [main]
    paths:
      - "rust-client/**"
      - "typescript-client/**"
      - "swap-program/**"
      - "escrow-program/**"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "rust-client/**"
      - "typescript-client/**"
      - "swap-program/**"
      - "escrow-program/**"
      - ".github/workflows/examples.yml"
  workflow_dispatch:

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

env:
  AGAVE_VERSION: v4.0.2
  SBF_TOOLS_VERSION: v1.54

jobs:
  rust-client:
    name: check / rust-client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-client
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-client

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check examples
        run: cargo check --all-targets --locked

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  typescript-client:
    name: check / typescript-client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript-client
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: typescript-client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check examples
        run: pnpm check

  swap-build:
    name: build / swap-program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: swap-program

      - name: Install Anza (Solana) CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install pinned SBF platform tools
        working-directory: swap-program/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" --install-only

      - name: Build swap program (SBF)
        working-directory: swap-program/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" -- --features bpf-entrypoint

  escrow-build:
    name: build / escrow-program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: escrow-program

      - name: Install Anza (Solana) CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install pinned SBF platform tools
        working-directory: escrow-program/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" --install-only

      - name: Build escrow program (SBF)
        working-directory: escrow-program/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" -- --features bpf-entrypoint
