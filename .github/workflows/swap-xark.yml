name: swap-xark

on:
  push:
    branches: [main]
    paths:
      - "swap/xark/**"
      - "swap/swap_program.md"
      - "test-utils/bench_report.rs"
      - "test-utils/xark_proving.rs"
      - "test-utils/zolana-release.sh"
      - ".github/workflows/swap-xark.yml"
  pull_request:
    paths:
      - "swap/xark/**"
      - "swap/swap_program.md"
      - "test-utils/bench_report.rs"
      - "test-utils/xark_proving.rs"
      - "test-utils/zolana-release.sh"
      - ".github/workflows/swap-xark.yml"
  workflow_dispatch:

concurrency:
  group: swap-xark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGAVE_VERSION: v4.0.2
  SBF_TOOLS_VERSION: v1.54

jobs:
  swap-xark-test:
    name: test / swap/xark
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: swap/xark
    steps:
      - uses: actions/checkout@v4

      # The Xark circuit build compiles the program crate for wasm32.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # The Zolana Git pins in Cargo.toml must match the release CLI revision.
      - name: Check Zolana pins
        run: scripts/setup-zk-tools.sh --check-pins

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: swap/xark

      - name: Install Anza CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install pinned SBF platform tools
        working-directory: swap/xark/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" --install-only

      # `zolana dev artifacts` downloads the prover, Photon, surfpool and
      # shielded-pool program the release pins into ~/.config/zolana/cache.
      - name: Cache Zolana release artifacts
        uses: actions/cache@v4
        with:
          path: ~/.config/zolana/cache
          key: swap-xark-zolana-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test-utils/zolana-release.sh') }}

      # Installs the pinned release CLI and exports ZOLANA_CLI_BIN.
      - name: Install the zolana CLI
        run: scripts/setup-zk-tools.sh >> "$GITHUB_ENV"

      # Exports ZOLANA_CLI_BIN, SHIELDED_POOL_PROGRAM_PATH, PROVER_BIN,
      # ZOLANA_PHOTON_BIN, SURFPOOL_BIN and USER_REGISTRY_PROGRAM_PATH.
      - name: Download localnet artifacts
        run: scripts/build-localnet.sh >> "$GITHUB_ENV"

      - name: Cache SPP proving keys
        uses: actions/cache@v4
        with:
          path: ~/.config/zolana/proving-keys
          key: swap-xark-proving-keys-${{ hashFiles('test-utils/zolana-release.sh') }}

      - name: Check Rust formatting
        run: cargo fmt -p swap-program -p swap-sdk -p swap-test -- --check

      # The deterministic test setup regenerates the circuits, keys and
      # verifiers, which must match the committed verifiers and checksums.
      - name: Check generated verifiers and circuit keys
        run: |
          "$ZOLANA_CLI_BIN" zk compile --test --skip-wasm --manifest-path program/Cargo.toml
          git diff --exit-code -- program/src/verifier
          test -z "$(git status --porcelain -- program/src/verifier)"
          scripts/check-keys.sh

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build swap program
        working-directory: swap/xark/program
        run: cargo build-sbf --tools-version "$SBF_TOOLS_VERSION" -- --locked --features bpf-entrypoint

      - name: Run program tests
        run: cargo test --locked -p swap-program --features bpf-entrypoint

      - name: Run SDK and circuit tests
        run: cargo test --release --locked -p swap-sdk

      - name: Run localnet end-to-end tests
        run: |
          mkdir -p ~/.config/zolana/proving-keys
          cargo test --release --locked -p swap-test -- --nocapture

      - name: Upload localnet logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swap-xark-localnet-logs
          path: |
            swap/xark/target/localnet/**/logs/**
            swap/xark/test/test-ledger/**
          if-no-files-found: ignore
