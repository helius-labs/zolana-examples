[package]
name = "timelock-escrow-test"
version = "0.1.0"
edition.workspace = true
publish = false
autotests = false

[dependencies]
anyhow = { workspace = true }
timelock-escrow-program = { path = "../program" }
timelock-escrow-prover = { path = "../prover" }
timelock-escrow-sdk = { path = "../sdk" }
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
spr-client = { workspace = true, features = ["solana-rpc"] }
spr-interface = { workspace = true }
spr-keypair = { workspace = true }
spr-program-test = { workspace = true, features = ["localnet"] }
spr-test-utils = { workspace = true }
spr-transaction = { workspace = true }

[dev-dependencies]
# Solana transactions serialize with bincode 1.x wire format; bincode 2.x is not
# byte-compatible, so this must stay pinned to match the runtime.
bincode = "1.3"
num-bigint = { workspace = true }
spr-hasher = { workspace = true }
spr-merkle-tree = { workspace = true }
spr-program = { workspace = true }
spr-tree = { workspace = true }
mollusk-svm = { workspace = true }
light-program-profiler = { workspace = true, features = ["mollusk"] }
solana-account = { workspace = true }
solana-instruction = { workspace = true }
solana-pubkey = { workspace = true }

[[test]]
name = "escrow"
path = "tests/escrow.rs"

[[test]]
name = "bench_cu"
path = "tests/bench_cu.rs"
