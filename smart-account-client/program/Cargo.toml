[package]
name = "storage"
version = "0.1.0"
description = "Chunked uploads and atomic replacement of per-owner records"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
bpf-entrypoint = []

[dependencies]
pinocchio = { version = "0.11", features = ["cpi", "account-resize"] }
# Address::find_program_address on host builds; SBF builds use the syscall.
solana-address = { version = "2.6", features = ["curve25519"] }
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }

[dev-dependencies]
mollusk-svm = "=0.13.4"
solana-account = "3.4"
# Address::new_unique in tests.
solana-address = { version = "2.6", features = ["atomic", "curve25519"] }
solana-instruction = "3.2"
solana-program-error = "3.0"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(target_os, values("solana"))']

[profile.release]
overflow-checks = true

[workspace]
