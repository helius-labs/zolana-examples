[package]
name = "data-registry"
version = "0.1.0"
description = "A stripped-down user registry: per-owner data that only the owner can replace"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
bpf-entrypoint = []

[dependencies]
pinocchio = { version = "0.11", features = ["cpi", "account-resize"] }
# Address::find_program_address on host builds; SBF builds use the syscall.
solana-address = { version = "2.6", features = ["curve25519"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(target_os, values("solana"))']

[profile.release]
overflow-checks = true

[workspace]
