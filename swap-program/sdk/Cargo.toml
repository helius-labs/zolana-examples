[package]
name = "swap-sdk"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
borsh = { version = "1.5", default-features = false, features = ["derive"] }
swap-program = { path = "../program" }
swap-prover = { path = "../prover" }
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-instruction = "3.4"
solana-pubkey = { version = "4.2", features = ["curve25519"] }
wincode = { version = "0.5", features = ["derive"] }
zolana-client = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
zolana-interface = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
zolana-program = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
zolana-hasher = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha", default-features = false }
zolana-keypair = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
zolana-transaction = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
zolana-wallet = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }

[dev-dependencies]
zolana-test-utils = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
groth16-solana = { git = "https://github.com/Lightprotocol/groth16-solana", rev = "70a93803e5f55b8425301d506c625169ef557c9d", features = ["bsb22"] }
solana-keypair = "3.1.2"
solana-signature = "3.4"
