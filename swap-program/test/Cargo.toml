[package]
name = "swap-test-validator"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false

[dependencies]
anyhow = "1.0"
swap-program = { path = "../program" }
swap-prover = { path = "../prover" }
swap-sdk = { path = "../sdk" }
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-signature = "3.4"
solana-signer = "3.0"
spr-client = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha", features = ["solana-rpc"] }
spr-interface = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
spr-keypair = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
spr-program-test = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha", features = ["localnet"] }
spr-test-utils = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
spr-transaction = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
spr-user-registry-interface = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha", features = ["solana"] }

[dev-dependencies]
# Solana transactions serialize with bincode 1.x wire format; bincode 2.x is not
# byte-compatible, so this must stay pinned to match the runtime.
bincode = "1.3"
borsh = { version = "1.5", default-features = false, features = ["derive"] }
groth16-solana = { version = "0.3.1", features = ["bsb22"] }
num-bigint = "0.4.6"
spr-hasher = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha", default-features = false }
spr-merkle-tree = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
spr-program = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
spr-tree = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
mollusk-svm = "0.15.0"
light-program-profiler = { git = "https://github.com/Lightprotocol/light-program-profiler", rev = "db49f3c801996a80e1cb7e4e92b13a694e962b65", features = ["mollusk"] }
solana-account = "4.3"
solana-instruction = "3.4"
solana-pubkey = { version = "4.2", features = ["curve25519"] }

[[test]]
name = "bench_cu"
path = "tests/bench_cu.rs"

[[test]]
name = "swap"
path = "tests/swap.rs"

[[test]]
name = "cancel"
path = "tests/cancel.rs"

[[test]]
name = "take_verifiable_encryption"
path = "tests/take_verifiable_encryption.rs"
