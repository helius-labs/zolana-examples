[workspace]
resolver = "2"
members = ["program", "sdk", "prover", "test"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
zolana-account-checks = { git = "https://github.com/helius-labs/zolana", rev = "82c49b8daf125ab25f887d261e95b8a0fa326588", default-features = false }
zolana-client = { git = "https://github.com/helius-labs/zolana", rev = "82c49b8daf125ab25f887d261e95b8a0fa326588" }
zolana-hasher = { git = "https://github.com/helius-labs/zolana", rev = "82c49b8daf125ab25f887d261e95b8a0fa326588", default-features = false }
zolana-interface = { git = "https://github.com/helius-labs/zolana", rev = "82c49b8daf125ab25f887d261e95b8a0fa326588" }
zolana-keypair = { git = "https://github.com/helius-labs/zolana", rev = "82c49b8daf125ab25f887d261e95b8a0fa326588" }
zolana-merkle-tree = { git = "https://github.com/helius-labs/zolana", rev = "82c49b8daf125ab25f887d261e95b8a0fa326588" }
zolana-program-test = { git = "https://github.com/helius-labs/zolana", rev = "82c49b8daf125ab25f887d261e95b8a0fa326588" }
zolana-test-utils = { git = "https://github.com/helius-labs/zolana", rev = "82c49b8daf125ab25f887d261e95b8a0fa326588" }
zolana-transaction = { git = "https://github.com/helius-labs/zolana", rev = "82c49b8daf125ab25f887d261e95b8a0fa326588" }
zolana-tree = { git = "https://github.com/helius-labs/zolana", rev = "82c49b8daf125ab25f887d261e95b8a0fa326588" }
zolana-user-registry-interface = { git = "https://github.com/helius-labs/zolana", rev = "82c49b8daf125ab25f887d261e95b8a0fa326588" }
zolana-wallet = { git = "https://github.com/helius-labs/zolana", rev = "82c49b8daf125ab25f887d261e95b8a0fa326588" }

groth16-solana = { git = "https://github.com/Lightprotocol/groth16-solana", rev = "43fee1a67e91c0df7bb4edad5ba87ae4602aa208", features = ["bsb22"] }
light-program-profiler = { git = "https://github.com/Lightprotocol/light-program-profiler", rev = "db49f3c801996a80e1cb7e4e92b13a694e962b65" }

anyhow = "1.0"
bindgen = "0.70"
borsh = { version = "1.5", default-features = false, features = ["derive"] }
mollusk-svm = "0.15.0"
num-bigint = "0.4.6"
pinocchio = "0.11"
serde_json = "1.0"
thiserror = "2.0"
wincode = { version = "0.5", features = ["derive"] }
solana-account = "4.3"
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-address-lookup-table-interface = { version = "3.0", features = ["bytemuck", "bincode"] }
solana-bn254 = "3.2.1"
solana-compute-budget-interface = "3.0"
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-message = "4.2"
solana-program-error = "3.0"
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-signature = "3.4"
solana-signer = "3.0"
solana-transaction = "4.1"
