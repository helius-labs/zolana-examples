[workspace]
resolver = "2"
members = ["sdk", "market-maker", "test-utils", "examples"]

[workspace.package]
edition = "2021"

# The zolana crates are pulled from the zolana repo by git, pinned to a release
# tag; the solana-* and other crates are pinned to the versions the SDK builds
# against.
[workspace.dependencies]
zolana-client = { git = "https://github.com/helius-labs/zolana", tag = "v0.4.0-alpha" }
zolana-event = { git = "https://github.com/helius-labs/zolana", tag = "v0.4.0-alpha" }
zolana-interface = { git = "https://github.com/helius-labs/zolana", tag = "v0.4.0-alpha" }
zolana-keypair = { git = "https://github.com/helius-labs/zolana", tag = "v0.4.0-alpha" }
zolana-program = { git = "https://github.com/helius-labs/zolana", tag = "v0.4.0-alpha" }
zolana-program-test = { git = "https://github.com/helius-labs/zolana", tag = "v0.4.0-alpha" }
zolana-test-utils = { git = "https://github.com/helius-labs/zolana", tag = "v0.4.0-alpha" }
zolana-transaction = { git = "https://github.com/helius-labs/zolana", tag = "v0.4.0-alpha" }

anyhow = "1.0"
serde_json = "1.0"
borsh = { version = "1.5", default-features = false, features = ["derive"] }
dashmap = "6.1.0"
futures = "0.3.31"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48.0", features = ["rt", "macros", "rt-multi-thread"] }
tokio-util = "0.7.19"
tracing = "0.1.41"
solana-account = "4.3"
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-commitment-config = "3.1"
solana-hash = "=4.5.0"
solana-instruction = "3.4"
solana-instruction-error = "2.4"
solana-keypair = "3.1.2"
solana-message = "4.2"
solana-rpc-client-api = "4.2"
solana-signature = "3.4"
solana-signer = "3.0"
solana-transaction = "4.1"
solana-transaction-error = "3.0"
solana-transaction-status-client-types = "4.1"
