[package]
name = "timelock-escrow-program"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "timelock_escrow_program"
crate-type = ["cdylib", "lib"]

[features]
# The committed verifying keys come from an insecure test setup
# (SetupKind::InsecureTest): the setup randomness is a fixed public seed, so
# the keys are reproducible and need no trusted setup ceremony. That is the
# recommended setup for integration tests, and it is secure there because a
# test validator holds nothing a forged proof could take. The keys do not
# compile without this feature, which is on by default because this program is
# an example, never a devnet or mainnet deployment.
default = ["insecure-test-setup"]
insecure-test-setup = []
bpf-entrypoint = []
no-entrypoint = []
cpi = ["no-entrypoint"]
test-sbf = []
profile-program = ["light-program-profiler/profile-program"]

[dependencies]
groth16-solana = { workspace = true, features = ["bsb22"] }
light-program-profiler = { workspace = true }
pinocchio = { workspace = true, features = ["cpi"] }
solana-program-error = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }
zolana-account-checks = { workspace = true }
zolana-hasher = { workspace = true }
zolana-interface = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
