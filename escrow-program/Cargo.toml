[workspace]
resolver = "2"
members = ["program", "sdk", "prover", "test"]

[workspace.package]
edition = "2021"

# The zolana crates are pulled from the zolana repo by git, pinned to a release
# tag; the solana-* and other crates are pinned to the versions the SDK builds
# against.
[workspace.dependencies]
spr-account-checks = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha", default-features = false }
spr-client = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
spr-gnark-ffi-prover = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
spr-gnark-ffi-prover-build = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
spr-hasher = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha", default-features = false }
spr-interface = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
spr-keypair = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
spr-merkle-tree = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
spr-program = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
spr-program-test = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
spr-test-utils = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
spr-transaction = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }
spr-tree = { git = "https://github.com/helius-labs/zolana", tag = "v0.6.0-alpha" }

groth16-solana = { version = "0.3.1", features = ["bsb22"] }
light-program-profiler = { git = "https://github.com/Lightprotocol/light-program-profiler", rev = "db49f3c801996a80e1cb7e4e92b13a694e962b65" }

anyhow = "1.0"
mollusk-svm = "0.15.0"
num-bigint = "0.4.6"
pinocchio = "0.11"
thiserror = "2.0"
wincode = { version = "0.5", features = ["derive"] }
solana-account = "4.3"
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-program-error = "3.0"
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-signature = "3.4"
solana-signer = "3.0"

[profile.release]
overflow-checks = true
