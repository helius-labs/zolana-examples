[workspace]
resolver = "2"
members = ["program", "sdk", "prover", "test"]

[workspace.package]
edition = "2021"

# The zolana crates are pulled from the zolana repo by git, pinned to a release
# tag; the solana-* and other crates are pinned to the versions the SDK builds
# against.
[workspace.dependencies]
zolana-account-checks = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha", default-features = false }
zolana-client = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
zolana-gnark-ffi-prover = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
zolana-gnark-ffi-prover-build = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
zolana-hasher = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha", default-features = false }
zolana-interface = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
zolana-keypair = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
zolana-merkle-tree = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
zolana-program = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
zolana-program-test = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
zolana-test-utils = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
zolana-transaction = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
zolana-tree = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }
zolana-wallet = { git = "https://github.com/helius-labs/zolana", tag = "v0.3.0-alpha" }

groth16-solana = { git = "https://github.com/Lightprotocol/groth16-solana", rev = "70a93803e5f55b8425301d506c625169ef557c9d", features = ["bsb22"] }
light-program-profiler = { git = "https://github.com/Lightprotocol/light-program-profiler", rev = "db49f3c801996a80e1cb7e4e92b13a694e962b65" }

anyhow = "1.0"
mollusk-svm = "0.15.0"
num-bigint = "0.4.6"
pinocchio = "0.11"
thiserror = "2.0"
wincode = { version = "0.5", features = ["derive"] }
solana-account = "4.3"
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-compute-budget-interface = "3.0"
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-message = "4.2"
solana-program-error = "3.0"
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-signature = "3.4"
solana-signer = "3.0"
solana-transaction = "4.1"

[profile.release]
overflow-checks = true
