[workspace]
resolver = "2"
members = ["program", "sdk", "prover", "test"]

[workspace.package]
edition = "2021"

# Use the published Zolana SDK; the unpublished test helpers are pinned to
# its release source. Other crates match the versions the SDK builds against.
[workspace.dependencies]
spr-account-checks = { version = "0.8.0", default-features = false }
spr-client = { version = "0.8.0" }
spr-gnark-ffi-prover = { version = "0.8.0" }
spr-gnark-ffi-prover-build = { version = "0.8.0" }
spr-hasher = { version = "0.8.0", default-features = false }
spr-interface = { version = "0.8.0" }
spr-keypair = { version = "0.8.0" }
spr-merkle-tree = { version = "0.8.0" }
spr-program = { version = "0.8.0" }
spr-program-test = { version = "0.8.0" }
spr-test-utils = { git = "https://github.com/helius-labs/zolana", rev = "6aba4a70177caaef602baf972ce4958691ec1e65" }
spr-transaction = { version = "0.8.0" }
spr-tree = { version = "0.8.0" }

groth16-solana = { version = "0.3.1", features = ["bsb22"] }
light-program-profiler = { git = "https://github.com/Lightprotocol/light-program-profiler", rev = "db49f3c801996a80e1cb7e4e92b13a694e962b65" }

anyhow = "1.0"
mollusk-svm = "0.15.0"
num-bigint = "0.4.6"
pinocchio = "0.11"
thiserror = "2.0"
wincode = { version = "0.5", features = ["derive"] }
solana-account = "4.3"
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-program-error = "3.0"
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-signature = "3.4"
solana-signer = "3.0"

[profile.release]
overflow-checks = true

# spr-test-utils is unpublished. Use the released SDK for its dependencies too,
# so test helpers and examples share the same Rust types.
[patch."https://github.com/helius-labs/zolana"]
spr-client = "0.8.0"
spr-event = "0.8.0"
spr-event-parser = "0.8.0"
spr-hasher = "0.8.0"
spr-interface = "0.8.0"
spr-keypair = "0.8.0"
spr-merkle-tree = "0.8.0"
spr-program = "0.8.0"
spr-program-test = "0.8.0"
spr-protocol-instructions = "0.8.0"
spr-smart-account-client = "0.8.0"
spr-transaction = "0.8.0"
spr-tree = "0.8.0"
spr-user-registry-interface = "0.8.0"
