[workspace]
resolver = "2"
members = ["program", "sdk", "prover", "test"]

[workspace.package]
edition = "2021"

# Crate versions stay 0.8.0. Protocol tag v0.8.0 changed the SDK after the
# crates.io publish, so these crates come from that commit. Other crates
# match the versions the SDK builds against.
[workspace.dependencies]
spr-account-checks = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d", default-features = false }
spr-client = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d" }
spr-gnark-ffi-prover = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d" }
spr-gnark-ffi-prover-build = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d" }
spr-hasher = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d", default-features = false }
spr-interface = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d" }
spr-keypair = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d" }
spr-merkle-tree = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d" }
spr-program = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d" }
spr-program-test = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d" }
spr-test-utils = { git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d" }
spr-transaction = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d" }
spr-tree = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d" }

groth16-solana = { version = "0.3.1", features = ["bsb22"] }
light-program-profiler = { git = "https://github.com/Lightprotocol/light-program-profiler", rev = "db49f3c801996a80e1cb7e4e92b13a694e962b65" }

anyhow = "1.0"
mollusk-svm = "0.15.0"
num-bigint = "0.4.6"
pinocchio = "0.11"
thiserror = "2.0"
wincode = { version = "0.5", features = ["derive"] }
solana-account = "4.3"
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-program-error = "3.0"
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-signature = "3.4"
solana-signer = "3.0"

[profile.release]
overflow-checks = true
