[workspace]
resolver = "2"
members = ["program", "sdk", "prover", "test"]

[workspace.package]
edition = "2021"

# Zolana is pinned to the draft SPP scaling branch used by the integration tests.
[workspace.dependencies]
zolana-account-checks = { git = "https://github.com/helius-labs/zolana", rev = "92858c801026d78dde7b3203444050ca7a8adb34", default-features = false }
zolana-client = { git = "https://github.com/helius-labs/zolana", rev = "92858c801026d78dde7b3203444050ca7a8adb34" }
zolana-gnark-ffi-prover = { git = "https://github.com/helius-labs/zolana", rev = "92858c801026d78dde7b3203444050ca7a8adb34" }
zolana-gnark-ffi-prover-build = { git = "https://github.com/helius-labs/zolana", rev = "92858c801026d78dde7b3203444050ca7a8adb34" }
zolana-hasher = { git = "https://github.com/helius-labs/zolana", rev = "92858c801026d78dde7b3203444050ca7a8adb34", default-features = false }
zolana-interface = { git = "https://github.com/helius-labs/zolana", rev = "92858c801026d78dde7b3203444050ca7a8adb34" }
zolana-keypair = { git = "https://github.com/helius-labs/zolana", rev = "92858c801026d78dde7b3203444050ca7a8adb34" }
zolana-merkle-tree = { git = "https://github.com/helius-labs/zolana", rev = "92858c801026d78dde7b3203444050ca7a8adb34" }
zolana-program = { git = "https://github.com/helius-labs/zolana", rev = "92858c801026d78dde7b3203444050ca7a8adb34" }
zolana-program-test = { git = "https://github.com/helius-labs/zolana", rev = "92858c801026d78dde7b3203444050ca7a8adb34" }
zolana-test-utils = { git = "https://github.com/helius-labs/zolana", rev = "92858c801026d78dde7b3203444050ca7a8adb34" }
zolana-transaction = { git = "https://github.com/helius-labs/zolana", rev = "92858c801026d78dde7b3203444050ca7a8adb34" }
zolana-tree = { git = "https://github.com/helius-labs/zolana", rev = "92858c801026d78dde7b3203444050ca7a8adb34" }

groth16-solana = { git = "https://github.com/Lightprotocol/groth16-solana", rev = "70a93803e5f55b8425301d506c625169ef557c9d", features = ["bsb22"] }
light-program-profiler = { git = "https://github.com/Lightprotocol/light-program-profiler", rev = "db49f3c801996a80e1cb7e4e92b13a694e962b65" }

anyhow = "1.0"
mollusk-svm = "0.15.0"
num-bigint = "0.4.6"
pinocchio = "0.11"
pinocchio-system = "0.6.0"
thiserror = "2.0"
wincode = { version = "0.5", features = ["derive"] }
solana-account = "4.3"
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-instruction = "3.4"
spl-token-2022-interface = "3.1.1"
solana-keypair = "3.1.2"
solana-program-error = "3.0"
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-signature = "3.4"
solana-signer = "3.0"
solana-epoch-schedule = "=3.2.0"
solana-sysvar = "=4.1.0"

borsh = "1.6.1"
spl-stake-pool = { git = "https://github.com/solana-program/stake-pool", rev = "8abfd17428728bc4c1ce181c238a3357bab82ad5", features = ["no-entrypoint"] }

[profile.release]
overflow-checks = true
