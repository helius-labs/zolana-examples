[package]
name = "swap-sdk"
version = "0.1.0"
edition.workspace = true
publish = false
autotests = false

[dependencies]
xark = { workspace = true }
xark-groth16 = { workspace = true }
# xark-groth16 leaves its MSM and FFT crates sequential (only its dev
# dependencies enable `parallel`); unify the features so native proofs use Rayon.
ark-ec = { version = "0.6", default-features = false, features = ["std", "parallel"] }
ark-poly = { version = "0.6", default-features = false, features = ["std", "parallel"] }
sha2 = "0.10"
tempfile = "3"
anyhow = { workspace = true }
borsh = { workspace = true }
swap-program = { path = "../program", features = ["circuits"] }
solana-address = { workspace = true, features = ["curve25519"] }
solana-instruction = { workspace = true }
solana-pubkey = { workspace = true }
wincode = { workspace = true }
spr-client = { workspace = true }
spr-interface = { workspace = true }
spr-program = { workspace = true, features = ["client"] }
spr-hasher = { workspace = true }
spr-keypair = { workspace = true }
spr-transaction = { workspace = true }

[dev-dependencies]
groth16-solana = { workspace = true }
spr-test-utils = { workspace = true }
solana-keypair = { workspace = true }
solana-signature = { workspace = true }

[[test]]
name = "circuits"
path = "tests/circuits.rs"

[[test]]
name = "instruction_signers"
path = "tests/instruction_signers.rs"

[[test]]
name = "make_transaction"
path = "tests/make_transaction.rs"
