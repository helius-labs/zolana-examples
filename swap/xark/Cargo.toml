[workspace]
resolver = "2"
members = ["program", "sdk", "test"]
exclude = [".tools/zolana"]

[workspace.package]
edition = "2021"

# The Zolana SDK and Xark come from pinned Git revisions: the Xark-backed
# program SDK is newer than the published 0.8.0 crates. scripts/setup-zk-tools.sh
# checks these pins against the revisions it builds the CLI from.
[workspace.dependencies]
xark = { git = "https://github.com/ananas-block/xark", rev = "aec8530d4526a082daed68ca2dd9c21d47a86f26" }
xark-groth16 = { git = "https://github.com/ananas-block/xark", rev = "aec8530d4526a082daed68ca2dd9c21d47a86f26" }
spr-account-checks = { git = "https://github.com/helius-labs/zolana", rev = "af9d32923c047e17c7a5b2985c92492ae18bfa2e", default-features = false }
spr-client = { git = "https://github.com/helius-labs/zolana", rev = "af9d32923c047e17c7a5b2985c92492ae18bfa2e" }
spr-hasher = { git = "https://github.com/helius-labs/zolana", rev = "af9d32923c047e17c7a5b2985c92492ae18bfa2e", default-features = false }
spr-interface = { git = "https://github.com/helius-labs/zolana", rev = "af9d32923c047e17c7a5b2985c92492ae18bfa2e" }
spr-keypair = { git = "https://github.com/helius-labs/zolana", rev = "af9d32923c047e17c7a5b2985c92492ae18bfa2e" }
spr-merkle-tree = { git = "https://github.com/helius-labs/zolana", rev = "af9d32923c047e17c7a5b2985c92492ae18bfa2e" }
spr-program = { git = "https://github.com/helius-labs/zolana", rev = "af9d32923c047e17c7a5b2985c92492ae18bfa2e" }
spr-program-test = { git = "https://github.com/helius-labs/zolana", rev = "af9d32923c047e17c7a5b2985c92492ae18bfa2e" }
spr-test-utils = { git = "https://github.com/helius-labs/zolana", rev = "af9d32923c047e17c7a5b2985c92492ae18bfa2e" }
spr-transaction = { git = "https://github.com/helius-labs/zolana", rev = "af9d32923c047e17c7a5b2985c92492ae18bfa2e" }
spr-tree = { git = "https://github.com/helius-labs/zolana", rev = "af9d32923c047e17c7a5b2985c92492ae18bfa2e" }
spr-user-registry-interface = { git = "https://github.com/helius-labs/zolana", rev = "af9d32923c047e17c7a5b2985c92492ae18bfa2e" }

groth16-solana = { version = "0.3.1", features = ["bsb22"] }
light-program-profiler = { git = "https://github.com/Lightprotocol/light-program-profiler", rev = "db49f3c801996a80e1cb7e4e92b13a694e962b65" }

anyhow = "1.0"
borsh = { version = "1.5", default-features = false, features = ["derive"] }
mollusk-svm = "0.15.0"
num-bigint = "0.4.6"
pinocchio = "0.11"
thiserror = "2.0"
wincode = { version = "0.5", features = ["derive"] }
solana-account = "4.3"
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-program-error = "3.0"
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-signature = "3.4"
solana-signer = "3.0"

[profile.release]
overflow-checks = true
