[package]
name = "swap-test-validator"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false

[dependencies]
anyhow = "1.0"
swap-program = { path = "../program" }
swap-prover = { path = "../prover" }
swap-sdk = { path = "../sdk" }
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-signature = "3.4"
solana-signer = "3.0"
spr-client = { version = "0.8.0", features = ["solana-rpc"] }
spr-interface = { version = "0.8.0" }
spr-keypair = { version = "0.8.0" }
spr-program-test = { version = "0.8.0", features = ["localnet"] }
spr-test-utils = { git = "https://github.com/helius-labs/zolana", rev = "6aba4a70177caaef602baf972ce4958691ec1e65" }
spr-transaction = { version = "0.8.0" }
spr-user-registry-interface = { version = "0.8.0", features = ["solana"] }

[dev-dependencies]
# Solana transactions serialize with bincode 1.x wire format; bincode 2.x is not
# byte-compatible, so this must stay pinned to match the runtime.
bincode = "1.3"
borsh = { version = "1.5", default-features = false, features = ["derive"] }
groth16-solana = "0.3.1"
num-bigint = "0.4.6"
spr-gnark-ffi-prover = { version = "0.8.0" }
spr-hasher = { version = "0.8.0", default-features = false }
spr-merkle-tree = { version = "0.8.0" }
spr-program = { version = "0.8.0" }
spr-tree = { version = "0.8.0" }
mollusk-svm = "0.15.0"
light-program-profiler = { git = "https://github.com/Lightprotocol/light-program-profiler", rev = "db49f3c801996a80e1cb7e4e92b13a694e962b65", features = ["mollusk"] }
solana-account = "4.3"
solana-instruction = "3.4"
solana-pubkey = { version = "4.2", features = ["curve25519"] }

[[test]]
name = "bench_cu"
path = "tests/bench_cu.rs"

[[test]]
name = "swap"
path = "tests/swap.rs"

[[test]]
name = "cancel"
path = "tests/cancel.rs"

# spr-test-utils is unpublished. Use the released SDK for its dependencies too,
# so test helpers and examples share the same Rust types.
[patch."https://github.com/helius-labs/zolana"]
spr-client = "0.8.0"
spr-event = "0.8.0"
spr-event-parser = "0.8.0"
spr-hasher = "0.8.0"
spr-interface = "0.8.0"
spr-keypair = "0.8.0"
spr-merkle-tree = "0.8.0"
spr-program = "0.8.0"
spr-program-test = "0.8.0"
spr-protocol-instructions = "0.8.0"
spr-smart-account-client = "0.8.0"
spr-transaction = "0.8.0"
spr-tree = "0.8.0"
spr-user-registry-interface = "0.8.0"
