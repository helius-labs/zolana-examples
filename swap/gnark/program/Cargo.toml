[package]
name = "swap-program"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "swap_program"
crate-type = ["cdylib", "lib"]

[features]
# The committed verifying keys come from an insecure test setup
# (SetupKind::InsecureTest): the setup randomness is a fixed public seed, so
# the keys are reproducible and need no trusted setup ceremony. That is the
# recommended setup for integration tests, and it is secure there because a
# test validator holds nothing a forged proof could take. The keys do not
# compile without this feature, which is on by default because this program is
# an example, never a devnet or mainnet deployment.
default = ["insecure-test-setup"]
insecure-test-setup = []
bpf-entrypoint = []
no-entrypoint = []
cpi = ["no-entrypoint"]
test-sbf = []
profile-program = ["light-program-profiler/profile-program"]

[dependencies]
borsh = { version = "1.5", default-features = false, features = ["derive"] }
groth16-solana = "0.3.1"
light-program-profiler = { git = "https://github.com/Lightprotocol/light-program-profiler", rev = "db49f3c801996a80e1cb7e4e92b13a694e962b65" }
pinocchio = { version = "0.11", features = ["cpi"] }
# `curve25519` gives `Address::create_program_address` a host implementation;
# on SBF it uses the syscall and pulls in no curve dependency.
solana-address = { version = "2.6", features = ["curve25519"] }
solana-program-error = "3.0"
thiserror = "2.0"
wincode = { version = "0.5", features = ["derive"] }
spr-account-checks = { git = "https://github.com/helius-labs/zolana", rev = "ca4cf4f6f0c83c0b225342e4bc6f16b3da83eb08", default-features = false }
spr-hasher = { git = "https://github.com/helius-labs/zolana", rev = "ca4cf4f6f0c83c0b225342e4bc6f16b3da83eb08", default-features = false }
spr-interface = { git = "https://github.com/helius-labs/zolana", rev = "ca4cf4f6f0c83c0b225342e4bc6f16b3da83eb08" }
spr-program = { git = "https://github.com/helius-labs/zolana", rev = "ca4cf4f6f0c83c0b225342e4bc6f16b3da83eb08", features = ["cpi", "compression"] }

[dev-dependencies]
mollusk-svm = "0.15.0"
solana-account = "4.3"
solana-instruction = "3.4"
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-program-error = "3.0"

# Carried over from the upstream zolana workspace root, whose release profile
# builds this program with overflow checks on.
[profile.release]
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
