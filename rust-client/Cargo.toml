[package]
name = "rust-client-example"
version = "0.1.0"
edition = "2021"
publish = false

# Crate versions stay 0.8.0. Protocol tag v0.8.0 changed the SDK after the
# crates.io publish, so these crates come from that commit. Solana crates
# match the versions the SDK builds against.
[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-keypair = "3.1.2"
solana-signature = "3.4"
solana-signer = "3.0"
solana-system-interface = { version = "3.2", features = ["bincode"] }
shellexpand = "3"
spl-token-interface = "3.0.0"
spr-client = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d", features = ["solana-rpc"] }
spr-interface = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d" }
spr-keypair = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d" }
spr-program = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d" }
spr-test-utils = { git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d" }
spr-transaction = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d" }
spr-user-registry-interface = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d", features = ["solana"] }

[dev-dependencies]
spr-program-test = { version = "0.8.0", git = "https://github.com/helius-labs/zolana", rev = "6660d98397147531af80e94fb367a597c8d0082d", features = ["localnet"] }

[[example]]
name = "register_private_wallet"
path = "examples/register_private_wallet.rs"

[[example]]
name = "deposit_transfer_withdraw"
path = "examples/deposit_transfer_withdraw.rs"

[[example]]
name = "sync_balance"
path = "examples/sync_balance.rs"

[[example]]
name = "read_history"
path = "examples/read_history.rs"

[[example]]
name = "deposit_with_interface_setup"
path = "examples/deposit_with_interface_setup.rs"
