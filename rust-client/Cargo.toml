[package]
name = "rust-client-example"
version = "0.1.0"
edition = "2021"
publish = false

# The zolana SDK crates are pinned to an SDK revision; the solana-* crates
# are pinned to the versions the SDK builds against.
[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-keypair = "3.1.2"
solana-signature = "3.4"
solana-signer = "3.0"
solana-system-interface = { version = "3.2", features = ["bincode"] }
shellexpand = "3"
spl-token-interface = "3.0.0"
zolana-client = { git = "https://github.com/helius-labs/zolana", rev = "4745bbb3bc60edd08ca0f348ea6cfc6a4ab168f8", features = ["indexer-api", "solana-rpc"] }
zolana-interface = { git = "https://github.com/helius-labs/zolana", rev = "4745bbb3bc60edd08ca0f348ea6cfc6a4ab168f8", features = ["solana"] }
zolana-keypair = { git = "https://github.com/helius-labs/zolana", rev = "4745bbb3bc60edd08ca0f348ea6cfc6a4ab168f8" }
zolana-transaction = { git = "https://github.com/helius-labs/zolana", rev = "4745bbb3bc60edd08ca0f348ea6cfc6a4ab168f8" }
zolana-wallet = { git = "https://github.com/helius-labs/zolana", rev = "4745bbb3bc60edd08ca0f348ea6cfc6a4ab168f8" }

[[example]]
name = "register_private_wallet"
path = "examples/register_private_wallet.rs"

[[example]]
name = "deposit_transfer_withdraw"
path = "examples/deposit_transfer_withdraw.rs"

[[example]]
name = "sync_balance"
path = "examples/sync_balance.rs"

[[example]]
name = "read_history"
path = "examples/read_history.rs"

[[example]]
name = "deposit_with_interface_setup"
path = "examples/deposit_with_interface_setup.rs"
