[package]
name = "rust-client-example"
version = "0.1.0"
edition = "2021"
publish = false

# The zolana SDK crates are pulled from the zolana repo by git, pinned to a rev
# with indexed-output waiting; Solana versions match the SDK.
[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-keypair = "3.1.2"
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-signature = "3.4"
solana-signer = "3.0"
solana-system-interface = "3.2.0"
shellexpand = "3"
zolana-client = { git = "https://github.com/helius-labs/zolana", rev = "167d1e6e9181074405f660dffb545a9cfb762d05", features = ["indexer-api", "solana-rpc"] }
zolana-interface = { git = "https://github.com/helius-labs/zolana", rev = "167d1e6e9181074405f660dffb545a9cfb762d05", features = ["solana"] }
zolana-keypair = { git = "https://github.com/helius-labs/zolana", rev = "167d1e6e9181074405f660dffb545a9cfb762d05" }
zolana-transaction = { git = "https://github.com/helius-labs/zolana", rev = "167d1e6e9181074405f660dffb545a9cfb762d05" }
zolana-user-registry-interface = { git = "https://github.com/helius-labs/zolana", rev = "167d1e6e9181074405f660dffb545a9cfb762d05", features = ["solana"] }
zolana-wallet = { git = "https://github.com/helius-labs/zolana", rev = "167d1e6e9181074405f660dffb545a9cfb762d05" }

[[example]]
name = "deposit_transfer_withdraw"
path = "examples/deposit_transfer_withdraw.rs"

[[example]]
name = "register_wallet_with_merge"
path = "examples/register_wallet_with_merge.rs"
