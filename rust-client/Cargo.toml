[package]
name = "rust-client-example"
version = "0.1.0"
edition = "2021"
publish = false

# The zolana SDK crates are pulled from the zolana repo by git, pinned to a rev
# on main; the solana-* crates are pinned to the versions the SDK builds against.
[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-keypair = "3.1.2"
solana-signature = "3.4"
solana-signer = "3.0"
solana-system-interface = "3.2.0"
shellexpand = "3"
zolana-client = { git = "https://github.com/helius-labs/zolana", rev = "5705c78ee4283d82ed445474f285b0daf4865606", features = ["indexer-api", "solana-rpc"] }
zolana-interface = { git = "https://github.com/helius-labs/zolana", rev = "5705c78ee4283d82ed445474f285b0daf4865606", features = ["solana"] }
zolana-keypair = { git = "https://github.com/helius-labs/zolana", rev = "5705c78ee4283d82ed445474f285b0daf4865606" }
zolana-transaction = { git = "https://github.com/helius-labs/zolana", rev = "5705c78ee4283d82ed445474f285b0daf4865606" }
zolana-wallet = { git = "https://github.com/helius-labs/zolana", rev = "5705c78ee4283d82ed445474f285b0daf4865606" }

[[example]]
name = "create_private_wallet"
path = "examples/create_private_wallet.rs"

[[example]]
name = "deposit_transfer_withdraw"
path = "examples/deposit_transfer_withdraw.rs"

[[example]]
name = "sync_balance"
path = "examples/sync_balance.rs"

[[example]]
name = "create_private_wallet_spl"
path = "examples/create_private_wallet_spl.rs"
