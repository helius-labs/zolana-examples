[package]
name = "rust-client-example"
version = "0.1.0"
edition = "2021"
publish = false

# The zolana SDK crates are pulled from the zolana repo by git, pinned to a rev
# on main; the solana-* crates are pinned to the versions the SDK builds against.
[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-keypair = "3.1.2"
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-signature = "3.4"
solana-signer = "3.0"
shellexpand = "3"
solana-system-interface = "3.2.0"
zolana-client = { git = "https://github.com/helius-labs/zolana", rev = "683a6c415962ba02c1e4e498d545e01ab38c0084", features = ["indexer-api", "solana-rpc"] }
zolana-interface = { git = "https://github.com/helius-labs/zolana", rev = "683a6c415962ba02c1e4e498d545e01ab38c0084", features = ["solana"] }
zolana-keypair = { git = "https://github.com/helius-labs/zolana", rev = "683a6c415962ba02c1e4e498d545e01ab38c0084" }
zolana-transaction = { git = "https://github.com/helius-labs/zolana", rev = "683a6c415962ba02c1e4e498d545e01ab38c0084" }
zolana-wallet = { git = "https://github.com/helius-labs/zolana", rev = "683a6c415962ba02c1e4e498d545e01ab38c0084" }

[[example]]
name = "deposit"
path = "examples/deposit.rs"

[[example]]
name = "transfer"
path = "examples/transfer.rs"

[[example]]
name = "withdraw"
path = "examples/withdraw.rs"

[[example]]
name = "sync_balance"
path = "examples/sync_balance.rs"

[[example]]
name = "create_private_wallet"
path = "examples/create_private_wallet.rs"

[[example]]
name = "deposit_instruction"
path = "examples/deposit_instruction.rs"

[[example]]
name = "transfer_instruction"
path = "examples/transfer_instruction.rs"

[[example]]
name = "withdraw_instruction"
path = "examples/withdraw_instruction.rs"
