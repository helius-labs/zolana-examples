[package]
name = "rust-client-example"
version = "0.1.0"
edition = "2021"
publish = false

# The zolana SDK crates are pinned to a revision; the solana-* crates
# are pinned to the versions the SDK builds against.
[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
solana-address = { version = "2.6", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-keypair = "3.1.2"
solana-signature = "3.4"
solana-signer = "3.0"
solana-system-interface = { version = "3.2", features = ["bincode"] }
sha2 = { version = "0.10", optional = true }
shellexpand = "3"
spl-token-interface = "3.0.0"
# The in-process gnark prover of the Zolana mobile SDK. Building it needs
# Go 1.27.1 or newer.
rust-gnark = { git = "https://github.com/helius-labs/zolana-mobile-sdk", rev = "bc0b1e1cf72bb39868105d9fef4676c51744aa3b", optional = true }
zolana-client = { git = "https://github.com/helius-labs/zolana", rev = "971c5c0e429d3886fb20f6638d68c581acdcdd42", features = ["indexer-api", "solana-rpc"] }
zolana-interface = { git = "https://github.com/helius-labs/zolana", rev = "971c5c0e429d3886fb20f6638d68c581acdcdd42" }
zolana-keypair = { git = "https://github.com/helius-labs/zolana", rev = "971c5c0e429d3886fb20f6638d68c581acdcdd42" }
zolana-program = { git = "https://github.com/helius-labs/zolana", rev = "971c5c0e429d3886fb20f6638d68c581acdcdd42" }
zolana-transaction = { git = "https://github.com/helius-labs/zolana", rev = "971c5c0e429d3886fb20f6638d68c581acdcdd42" }

[features]
# Prove on this machine instead of the prover server.
local-prover = ["dep:rust-gnark", "dep:sha2"]

[[example]]
name = "register_private_wallet"
path = "examples/register_private_wallet.rs"

[[example]]
name = "deposit_transfer_withdraw"
path = "examples/deposit_transfer_withdraw.rs"

[[example]]
name = "sync_balance"
path = "examples/sync_balance.rs"

[[example]]
name = "read_history"
path = "examples/read_history.rs"

[[example]]
name = "deposit_with_interface_setup"
path = "examples/deposit_with_interface_setup.rs"
